<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlphaFoxXP - Login Seguro</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      overflow: hidden;
      position: relative;
    }

    /* Particles.js container */
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Gradiente sutil de fundo */
    .animated-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
      z-index: 0;
    }

    /* Container principal */
    .main-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-container {
      background: rgba(20, 20, 20, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 40px 35px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255, 102, 0, 0.3);
      border: 1px solid rgba(255, 102, 0, 0.2);
      animation: fadeIn 0.4s ease-out;
      position: relative;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Logo/Título */
    .logo-container {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
      z-index: 2;
    }

    .logo-icon {
      font-size: 48px;
      margin-bottom: 12px;
      filter: grayscale(0);
      display: inline-block;
    }

    h2 {
      font-family: 'Orbitron', sans-serif;
      color: #ff6600;
      font-size: 26px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      margin-bottom: 0;
      letter-spacing: 0.5px;
      font-weight: 300;
    }

    /* Campos de entrada */
    .input-group {
      position: relative;
      margin-bottom: 20px;
      z-index: 2;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #ff6600;
      font-size: 16px;
      z-index: 3;
      transition: all 0.3s ease;
    }

    input {
      width: 100%;
      padding: 14px 14px 14px 46px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 102, 0, 0.2);
      border-radius: 10px;
      font-size: 14px;
      color: #ffffff;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
      font-weight: 400;
    }

    input:focus {
      outline: none;
      border: 1px solid rgba(255, 102, 0, 0.5);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 0 3px rgba(255, 102, 0, 0.1);
    }

    input:focus + .input-icon {
      color: #ff8800;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    /* Container de senha */
    .password-container {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #ff6600;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s ease;
      z-index: 3;
    }

    .toggle-password:hover {
      color: #ff8800;
    }

    /* Botões */
    button {
      width: 100%;
      padding: 14px;
      background: #ff6600;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
      position: relative;
      overflow: hidden;
      z-index: 2;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      background: #ff7711;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 102, 0, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: rgba(255, 102, 0, 0.4);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Loading spinner */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mensagens */
    .message {
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      animation: slideDown 0.3s ease-out;
      display: none;
      z-index: 2;
      position: relative;
    }

    .message.error {
      background: rgba(220, 38, 38, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(220, 38, 38, 0.3);
    }

    .message.success {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Links */
    .link {
      text-align: center;
      margin-top: 18px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      z-index: 2;
      position: relative;
      font-weight: 300;
    }

    .link a {
      color: #ff6600;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .link a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 1px;
      bottom: -2px;
      left: 0;
      background: #ff6600;
      transition: width 0.3s ease;
    }

    .link a:hover::after {
      width: 100%;
    }

    .link a:hover {
      color: #ff8800;
    }

    /* Modal de Boas-vindas */
    .welcome-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeIn 0.3s;
    }

    .welcome-content {
      background: linear-gradient(135deg, #ff6600 0%, #ff7711 100%);
      padding: 50px 45px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      animation: scaleIn 0.4s ease-out;
      max-width: 480px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.9);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .welcome-icon {
      font-size: 72px;
      margin-bottom: 20px;
      filter: grayscale(0);
    }

    .welcome-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      color: #ffffff;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .welcome-username {
      font-size: 26px;
      color: #000000;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .welcome-message {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 28px;
      line-height: 1.6;
      font-weight: 400;
    }

    .loading-bar {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 20px;
    }

    .loading-progress {
      height: 100%;
      background: #ffffff;
      width: 0;
      animation: loadingBar 2.5s ease-out forwards;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    @keyframes loadingBar {
      to { width: 100%; }
    }

    /* Responsivo */
    @media (max-width: 480px) {
      .login-container {
        padding: 32px 28px;
      }

      h2 {
        font-size: 22px;
      }

      .welcome-content {
        padding: 40px 32px;
        margin: 20px;
      }

      .welcome-title {
        font-size: 24px;
      }

      .welcome-username {
        font-size: 22px;
      }
    }

    /* Remover scan line - minimalista */
    .scan-line {
      display: none;
    }

    /* Remover efeito de borda rotativa */
    .login-container::before {
      display: none;
    }
  </style>

</head>
<body>
  <!-- Background animado -->
  <div class="animated-bg"></div>
  
  <!-- Particles.js container -->
  <div id="particles-js"></div>

  <!-- Modal de Boas-vindas -->
  <div class="welcome-modal" id="welcomeModal">
    <div class="welcome-content">
      <div class="welcome-icon" id="welcomeIcon">🦊</div>
      <div class="welcome-title" id="welcomeTitle">Bem-vindo!</div>
      <div class="welcome-username" id="welcomeUsername"></div>
      <div class="welcome-message" id="welcomeMessage"></div>
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
    </div>
  </div>

  <div class="main-container">
    <!-- Formulário de Login -->
    <div class="login-container" id="loginForm">
      <div class="scan-line"></div>
      <div class="logo-container">
        <div class="logo-icon">🦊</div>
        <h2>AlphaFoxXP</h2>
        <p class="subtitle">Acesso Seguro ao Sistema</p>
      </div>

      <div class="input-group">
        <i class="fas fa-user input-icon"></i>
        <input type="text" id="username" placeholder="Usuário" required autocomplete="username">
      </div>

      <div class="input-group">
        <div class="password-container">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" placeholder="Senha" required autocomplete="current-password">
          <i class="fas fa-eye toggle-password" id="togglePassword"></i>
        </div>
      </div>

      <button id="loginButton">
        <span class="button-text"><i class="fas fa-sign-in-alt"></i> Entrar</span>
        <div class="spinner"></div>
      </button>

      <div class="message" id="loginMessage" role="alert"></div>

      <div class="link">
        Não tem uma conta? <a href="#" id="showCadastro">Criar conta</a>
      </div>
      <div class="link">
        Esqueceu sua senha? <a href="#" id="showChangePassword">Recuperar senha</a>
      </div>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="login-container" id="cadastroForm" style="display: none;">
      <div class="scan-line"></div>
      <div class="logo-container">
        <div class="logo-icon">🎯</div>
        <h2>Criar Conta</h2>
        <p class="subtitle">Junte-se ao AlphaFoxXP</p>
      </div>

      <div class="input-group">
        <i class="fas fa-user input-icon"></i>
        <input type="text" id="newUsername" placeholder="Nome de Usuário" required autocomplete="username">
      </div>

      <div class="input-group">
        <i class="fas fa-id-card input-icon"></i>
        <input type="text" id="cpf" placeholder="CPF (XXX.XXX.XXX-XX)" maxlength="14" required autocomplete="off">
      </div>

      <div class="input-group">
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" id="email" placeholder="E-mail" required autocomplete="email">
      </div>

      <div class="input-group">
        <div class="password-container">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="newPassword" placeholder="Senha (mínimo 6 caracteres)" required autocomplete="new-password">
          <i class="fas fa-eye toggle-password" id="toggleNewPassword"></i>
        </div>
      </div>

      <button id="registerButton">
        <span class="button-text"><i class="fas fa-user-plus"></i> Registrar</span>
        <div class="spinner"></div>
      </button>

      <div class="message" id="cadastroMessage" role="alert"></div>

      <div class="link">
        Já tem uma conta? <a href="#" id="showLogin">Fazer Login</a>
      </div>
    </div>

    <!-- Formulário de Trocar Senha -->
    <div class="login-container" id="changePasswordForm" style="display: none;">
      <div class="scan-line"></div>
      <div class="logo-container">
        <div class="logo-icon">🔐</div>
        <h2>Recuperar Senha</h2>
        <p class="subtitle">Redefina sua senha de acesso</p>
      </div>

      <div class="input-group">
        <i class="fas fa-id-card input-icon"></i>
        <input type="text" id="changeCpf" placeholder="Digite seu CPF" maxlength="14" required autocomplete="off">
      </div>

      <div class="input-group">
        <i class="fas fa-user input-icon"></i>
        <input type="text" id="changeUsername" placeholder="Digite seu Usuário" required autocomplete="username">
      </div>

      <div class="input-group">
        <div class="password-container">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="newChangePassword" placeholder="Nova Senha (mínimo 6 caracteres)" required autocomplete="new-password">
          <i class="fas fa-eye toggle-password" id="toggleNewChangePassword"></i>
        </div>
      </div>

      <button id="changePasswordButton">
        <span class="button-text"><i class="fas fa-key"></i> Alterar Senha</span>
        <div class="spinner"></div>
      </button>

      <div class="message" id="changePasswordMessage" role="alert"></div>

      <div class="link">
        Voltar ao <a href="#" id="showLoginFromChangePassword">Login</a>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  
  <!-- Particles.js -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  
  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDOMJYymvjApHshn7TWe83KEpM-2eoC09A",
      authDomain: "escola-5db5c.firebaseapp.com",
      projectId: "escola-5db5c",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <script>
  // Configuração do Particles.js
    particlesJS('particles-js', {
      particles: {
        number: {
          value: 80,
          density: {
            enable: true,
            value_area: 800
          }
        },
        color: {
          value: ['#ff6600', '#ff8800', '#ffaa00']
        },
        shape: {
          type: 'circle',
          stroke: {
            width: 0,
            color: '#000000'
          }
        },
        opacity: {
          value: 0.5,
          random: true,
          anim: {
            enable: true,
            speed: 1,
            opacity_min: 0.1,
            sync: false
          }
        },
        size: {
          value: 4,
          random: true,
          anim: {
            enable: true,
            speed: 2,
            size_min: 0.1,
            sync: false
          }
        },
        line_linked: {
          enable: true,
          distance: 150,
          color: '#ff6600',
          opacity: 0.4,
          width: 1
        },
        move: {
          enable: true,
          speed: 2,
          direction: 'none',
          random: true,
          straight: false,
          out_mode: 'out',
          bounce: false,
          attract: {
            enable: true,
            rotateX: 600,
            rotateY: 1200
          }
        }
      },
      interactivity: {
        detect_on: 'canvas',
        events: {
          onhover: {
            enable: true,
            mode: 'repulse'
          },
          onclick: {
            enable: true,
            mode: 'push'
          },
          resize: true
        },
        modes: {
          repulse: {
            distance: 100,
            duration: 0.4
          },
          push: {
            particles_nb: 4
          }
        }
      },
      retina_detect: true
    });

    // Funções auxiliares
    function validarCPF(cpf) {
      const regex = /^\d{3}\.\d{3}\.\d{3}-\d{2}$/;
      return regex.test(cpf);
    }

    function formatCPF(input) {
      let value = input.value.replace(/\D/g, '');
      value = value.replace(/(\d{3})(\d)/, '$1.$2');
      value = value.replace(/(\d{3})(\d)/, '$1.$2');
      value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      input.value = value;
    }

    // Adicionar formatação automática aos campos CPF
    document.getElementById('cpf').addEventListener('input', function() {
      formatCPF(this);
    });
    document.getElementById('changeCpf').addEventListener('input', function() {
      formatCPF(this);
    });

    function showMessage(elementId, message, type) {
      const messageElement = document.getElementById(elementId);
      messageElement.textContent = message;
      messageElement.className = `message ${type}`;
      messageElement.style.display = 'block';
      
      setTimeout(() => {
        messageElement.style.display = 'none';
      }, 5000);
    }

    function setButtonLoading(buttonId, isLoading) {
      const button = document.getElementById(buttonId);
      const spinner = button.querySelector('.spinner');
      const buttonText = button.querySelector('.button-text');
      
      if (isLoading) {
        button.disabled = true;
        buttonText.style.display = 'none';
        spinner.style.display = 'block';
      } else {
        button.disabled = false;
        buttonText.style.display = 'inline';
        spinner.style.display = 'none';
      }
    }

    function showWelcomeModal(username, isNewUser) {
      const modal = document.getElementById('welcomeModal');
      const icon = document.getElementById('welcomeIcon');
      const title = document.getElementById('welcomeTitle');
      const usernameEl = document.getElementById('welcomeUsername');
      const message = document.getElementById('welcomeMessage');

      if (isNewUser) {
        icon.textContent = '🎉';
        title.textContent = 'Bem-vindo!';
        usernameEl.textContent = username;
        message.innerHTML = 'Sua conta foi criada com sucesso!<br>Prepare-se para uma experiência incrível na AlphaFoxXP!';
      } else {
        icon.textContent = '🦊';
        title.textContent = 'Bem-vindo de volta!';
        usernameEl.textContent = username;
        message.innerHTML =         'Que bom te ver novamente!<br>Seus dados estão prontos e aguardando por você.';
      }

      modal.style.display = 'flex';

      setTimeout(() => {
        window.location.href = 'https://codepen.io/luan-escola-the-scripter/full/PwqBBoY';
      }, 2800);
    }

    // Migrar dados do localStorage para Firebase (executa uma vez)
    async function migrateLocalStorageToFirebase() {
      try {
        const users = JSON.parse(localStorage.getItem('users')) || [];
        const userLoginHistory = JSON.parse(localStorage.getItem('userLoginHistory')) || {};

        if (users.length > 0) {
          console.log('Migrando dados do localStorage para Firebase...');
          
          for (const user of users) {
            // Verificar se usuário já existe no Firebase
            const userSnapshot = await db.collection('users').doc(user.username).get();
            
            if (!userSnapshot.exists) {
              await db.collection('users').doc(user.username).set({
                username: user.username,
                password: user.password,
                cpf: user.cpf,
                email: user.email,
                nivel: user.nivel || 1,
                status: user.status || 'ativo',
                createdAt: user.createdAt || new Date().toISOString()
              });

              // Migrar histórico de login
              if (userLoginHistory[user.username]) {
                await db.collection('loginHistory').doc(user.username).set(userLoginHistory[user.username]);
              }
            }
          }

          console.log('Migração concluída! Limpando localStorage...');
          localStorage.removeItem('users');
          localStorage.removeItem('userLoginHistory');
          localStorage.removeItem('currentUser');
        }
      } catch (error) {
        console.error('Erro na migração:', error);
      }
    }

    // Executar migração ao carregar a página
    migrateLocalStorageToFirebase();

    // LOGIN
    document.getElementById('loginButton').addEventListener('click', async function() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showMessage('loginMessage', '⚠️ Preencha todos os campos!', 'error');
        return;
      }

      setButtonLoading('loginButton', true);

      try {
        // Buscar usuário no Firebase
        const userDoc = await db.collection('users').doc(username).get();

        if (userDoc.exists) {
          const user = userDoc.data();

          if (user.status === 'banido') {
            showMessage('loginMessage', '🚫 Sua conta foi banida. Entre em contato com o suporte.', 'error');
            setButtonLoading('loginButton', false);
            return;
          }

          if (user.status === 'suspenso') {
            showMessage('loginMessage', '⏸️ Sua conta está suspensa temporariamente.', 'error');
            setButtonLoading('loginButton', false);
            return;
          }

          if (user.password === password) {
            // Buscar histórico de login
            const loginHistoryDoc = await db.collection('loginHistory').doc(username).get();
            const isNewUser = !loginHistoryDoc.exists;

            // Atualizar histórico de login
            if (isNewUser) {
              await db.collection('loginHistory').doc(username).set({
                firstLogin: new Date().toISOString(),
                loginCount: 1,
                lastLogin: new Date().toISOString()
              });
            } else {
              const history = loginHistoryDoc.data();
              await db.collection('loginHistory').doc(username).update({
                loginCount: (history.loginCount || 0) + 1,
                lastLogin: new Date().toISOString()
              });
            }

            // Salvar sessão atual (pode usar sessionStorage temporariamente)
            sessionStorage.setItem('currentUser', JSON.stringify(user));

            setButtonLoading('loginButton', false);
            showWelcomeModal(username, isNewUser);
          } else {
            showMessage('loginMessage', '❌ Senha incorreta. Tente novamente.', 'error');
            setButtonLoading('loginButton', false);
          }
        } else {
          showMessage('loginMessage', '❌ Usuário não encontrado.', 'error');
          setButtonLoading('loginButton', false);
        }
      } catch (error) {
        console.error('Erro no login:', error);
        showMessage('loginMessage', '❌ Erro ao fazer login. Tente novamente.', 'error');
        setButtonLoading('loginButton', false);
      }
    });

    // CADASTRO
    document.getElementById('registerButton').addEventListener('click', async function() {
      const newUsername = document.getElementById('newUsername').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const cpf = document.getElementById('cpf').value;
      const email = document.getElementById('email').value.trim();

      if (!newUsername || !newPassword || !cpf || !email) {
        showMessage('cadastroMessage', '⚠️ Preencha todos os campos!', 'error');
        return;
      }

      if (!validarCPF(cpf)) {
        showMessage('cadastroMessage', '❌ CPF inválido. Verifique o formato.', 'error');
        return;
      }

      if (newPassword.length < 6) {
        showMessage('cadastroMessage', '❌ A senha deve ter no mínimo 6 caracteres.', 'error');
        return;
      }

      // Validar email
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showMessage('cadastroMessage', '❌ E-mail inválido.', 'error');
        return;
      }

      setButtonLoading('registerButton', true);

      try {
        // Verificar se usuário já existe
        const userDoc = await db.collection('users').doc(newUsername).get();
        if (userDoc.exists) {
          showMessage('cadastroMessage', '❌ Este usuário já existe. Escolha outro nome.', 'error');
          setButtonLoading('registerButton', false);
          return;
        }

        // Verificar se CPF já está cadastrado
        const cpfQuery = await db.collection('users').where('cpf', '==', cpf).get();
        if (!cpfQuery.empty) {
          showMessage('cadastroMessage', '❌ CPF já cadastrado no sistema.', 'error');
          setButtonLoading('registerButton', false);
          return;
        }

        // Verificar se email já está cadastrado
        const emailQuery = await db.collection('users').where('email', '==', email).get();
        if (!emailQuery.empty) {
          showMessage('cadastroMessage', '❌ E-mail já cadastrado no sistema.', 'error');
          setButtonLoading('registerButton', false);
          return;
        }

        // Criar novo usuário no Firebase
        await db.collection('users').doc(newUsername).set({
          username: newUsername,
          password: newPassword,
          cpf: cpf,
          email: email,
          nivel: 1,
          status: 'ativo',
          createdAt: new Date().toISOString()
        });

        setButtonLoading('registerButton', false);
        showMessage('cadastroMessage', '✅ Conta criada com sucesso! Redirecionando...', 'success');

        setTimeout(() => {
          document.getElementById('cadastroForm').style.display = 'none';
          document.getElementById('loginForm').style.display = 'block';
          // Limpar campos
          document.getElementById('newUsername').value = '';
          document.getElementById('newPassword').value = '';
          document.getElementById('cpf').value = '';
          document.getElementById('email').value = '';
        }, 2000);

      } catch (error) {
        console.error('Erro no cadastro:', error);
        showMessage('cadastroMessage', '❌ Erro ao criar conta. Tente novamente.', 'error');
        setButtonLoading('registerButton', false);
      }
    });

    // TROCAR SENHA
    document.getElementById('changePasswordButton').addEventListener('click', async function() {
      const cpf = document.getElementById('changeCpf').value;
      const username = document.getElementById('changeUsername').value.trim();
      const newPassword = document.getElementById('newChangePassword').value;

      if (!cpf || !username || !newPassword) {
        showMessage('changePasswordMessage', '⚠️ Preencha todos os campos!', 'error');
        return;
      }

      if (!validarCPF(cpf)) {
        showMessage('changePasswordMessage', '❌ CPF inválido.', 'error');
        return;
      }

      if (newPassword.length < 6) {
        showMessage('changePasswordMessage', '❌ A senha deve ter no mínimo 6 caracteres.', 'error');
        return;
      }

      setButtonLoading('changePasswordButton', true);

      try {
        // Buscar usuário no Firebase
        const userDoc = await db.collection('users').doc(username).get();

        if (!userDoc.exists) {
          showMessage('changePasswordMessage', '❌ Usuário não encontrado.', 'error');
          setButtonLoading('changePasswordButton', false);
          return;
        }

        const user = userDoc.data();

        if (user.cpf !== cpf) {
          showMessage('changePasswordMessage', '❌ CPF não corresponde ao usuário.', 'error');
          setButtonLoading('changePasswordButton', false);
          return;
        }

        // Atualizar senha no Firebase
        await db.collection('users').doc(username).update({
          password: newPassword
        });

        setButtonLoading('changePasswordButton', false);
        showMessage('changePasswordMessage', '✅ Senha alterada com sucesso! Redirecionando...', 'success');

        setTimeout(() => {
          document.getElementById('changePasswordForm').style.display = 'none';
          document.getElementById('loginForm').style.display = 'block';
          // Limpar campos
          document.getElementById('changeCpf').value = '';
          document.getElementById('changeUsername').value = '';
          document.getElementById('newChangePassword').value = '';
        }, 2000);

      } catch (error) {
        console.error('Erro ao alterar senha:', error);
        showMessage('changePasswordMessage', '❌ Erro ao alterar senha. Tente novamente.', 'error');
        setButtonLoading('changePasswordButton', false);
      }
    });

    // NAVEGAÇÃO ENTRE TELAS
    document.getElementById('showCadastro').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('cadastroForm').style.display = 'block';
      document.getElementById('changePasswordForm').style.display = 'none';
    });

    document.getElementById('showLogin').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('cadastroForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('changePasswordForm').style.display = 'none';
    });

    document.getElementById('showChangePassword').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('changePasswordForm').style.display = 'block';
      document.getElementById('cadastroForm').style.display = 'none';
    });

    document.getElementById('showLoginFromChangePassword').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('changePasswordForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('cadastroForm').style.display = 'none';
    });

    // TOGGLE DE VISIBILIDADE DE SENHA
    function togglePasswordVisibility(passwordInputId, toggleIconId) {
      const passwordInput = document.getElementById(passwordInputId);
      const toggleIcon = document.getElementById(toggleIconId);

      toggleIcon.addEventListener('click', function() {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          passwordInput.type = 'password';
          toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    }

    togglePasswordVisibility('password', 'togglePassword');
    togglePasswordVisibility('newPassword', 'toggleNewPassword');
    togglePasswordVisibility('newChangePassword', 'toggleNewChangePassword');

    // ENTER PARA SUBMETER
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('loginButton').click();
    });

    document.getElementById('username').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('loginButton').click();
    });

    document.getElementById('newPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('registerButton').click();
    });

    document.getElementById('email').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('registerButton').click();
    });

    document.getElementById('newChangePassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('changePasswordButton').click();
    });

    document.getElementById('changeUsername').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('changePasswordButton').click();
    });
  </script>
</body>
</html>
